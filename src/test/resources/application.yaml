# src/test/resources/application.yml
# Overrides ONLY for tests (mvn test, @SpringBootTest, CI)

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  # The rest (as before)
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  liquibase:
    enabled: false