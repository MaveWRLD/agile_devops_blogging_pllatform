# src/test/resources/application.yml
# This overrides ONLY for tests → prevents DataSource/JPA auto-config from running

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  # Still good to have these
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  liquibase:
    enabled: false

  # Optional extras if needed (prevents other surprises)
  # graphql:
  #   graphiql:
  #     enabled: false